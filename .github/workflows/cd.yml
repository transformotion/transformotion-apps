# cd.yml — Full-platform manual redeploy (workflow_dispatch only).
# For normal pushes, use the path-filtered per-app workflows:
#   deploy-platform.yml      — triggered by infrastructure/lib/platform/** changes
#   deploy-stock-analyser.yml — triggered by apps/stock-analyser/** changes
#   deploy-budget-tracker.yml — placeholder, activates when BT scaffolding exists

name: CD — Full platform redeploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: cd-full-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ROLE_ARN: arn:aws:iam::959516291617:role/GitHubActionsDeployRole

jobs:
  full-deploy:
    name: Full deploy → ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — all stacks
        working-directory: infrastructure
        run: |
          STAGE=${{ github.event.inputs.target == 'dev' && 'Dev' || 'Prod' }}
          pnpm exec cdk deploy "Transformotion${STAGE}-*" --require-approval never

      - name: Build Stock Analyser
        working-directory: apps/stock-analyser
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CLAUDE_API_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_API_URL }}
          NEXT_PUBLIC_CLAUDE_CACHE_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_CACHE_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
        run: pnpm build

      - name: Deploy Stock Analyser to S3
        env:
          S3_BUCKET_DEV: transformotion-web-dev-959516291617
          CF_DIST_DEV: E1128DYYBLMWYK
        run: |
          if [ "${{ github.event.inputs.target }}" = "dev" ]; then
            aws s3 sync apps/stock-analyser/out s3://$S3_BUCKET_DEV --delete
            aws cloudfront create-invalidation --distribution-id $CF_DIST_DEV --paths "/*"
          else
            aws s3 sync apps/stock-analyser/out s3://${{ vars.S3_BUCKET_PROD }} --delete
            aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} --paths "/*"
          fi
