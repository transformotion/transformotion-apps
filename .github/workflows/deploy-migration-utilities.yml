name: Deploy — Migration Utilities

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/deploy-migration-utilities.yml'
      - 'migration-utilities/**'
      - '!migration-utilities/**/AGENTS.md'
      - '!migration-utilities/**/CLAUDE.md'
      - '!migration-utilities/**/README.md'
      - '!migration-utilities/**/docs/**'
      - 'infrastructure/bin/migration-utilities.ts'
      - 'packages/**'
      - '!packages/**/AGENTS.md'
      - '!packages/**/CLAUDE.md'
      - '!packages/**/README.md'
      - '!packages/**/docs/**'
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: 'Deploy target: dev or prod'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-migration-utilities-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ROLE_ARN: arn:aws:iam::959516291617:role/TransformotionMigrationUtilitiesDeployRole

jobs:
  deploy-dev:
    name: Migration Utilities → Dev
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_call' && inputs.target == 'dev') || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — Migration Utilities stack (dev)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/migration-utilities.ts' 'TransformotionDev-MigrationsApi' --require-approval never

  deploy-prod:
    name: Migration Utilities → Prod
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_call' && inputs.target == 'prod') || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — Migration Utilities stack (prod)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/migration-utilities.ts' 'TransformotionProd-MigrationsApi' --require-approval never
