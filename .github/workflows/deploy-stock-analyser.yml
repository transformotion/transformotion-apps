name: Deploy — Stock Analyser

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/deploy-stock-analyser.yml'
      - 'apps/stock-analyser/**'
      - '!apps/stock-analyser/AGENTS.md'
      - '!apps/stock-analyser/CLAUDE.md'
      - '!apps/stock-analyser/README.md'
      - '!apps/stock-analyser/docs/**'
      - 'infrastructure/bin/stock-analyser.ts'
      - 'infrastructure/lib/auth-domain-exports.ts'
      - 'packages/api-client/**'
      - 'packages/brand-tokens/**'
      - 'packages/cache/**'
      - 'packages/contracts/**'
      - 'packages/data-access/**'
      - 'packages/logger/**'
      - 'packages/ui/**'
      - 'packages/auth-client/**'
      - 'packages/runtime-config/**'
      - 'packages/lambda-middleware/**'
      - 'packages/fn-ai-proxy-core/**'
      - 'packages/fn-account-membership/**'
      - '!packages/**/AGENTS.md'
      - '!packages/**/CLAUDE.md'
      - '!packages/**/README.md'
      - '!packages/**/docs/**'
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: 'Deploy target: dev or prod'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-stock-analyser-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ROLE_ARN: arn:aws:iam::959516291617:role/TransformotionStockAnalyserDeployRole

jobs:
  deploy-dev:
    name: Stock Analyser → Dev
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_call' && inputs.target == 'dev') || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment: dev
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_AI_API_URL: ${{ vars.NEXT_PUBLIC_AI_API_URL }}
      NEXT_PUBLIC_AI_CACHE_URL: ${{ vars.NEXT_PUBLIC_AI_CACHE_URL }}
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_STOCK_ANALYSER_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser/callback
      NEXT_PUBLIC_RUNTIME_PROFILE: live
      NEXT_PUBLIC_BUDGET_URL: ${{ vars.NEXT_PUBLIC_BUDGET_URL }}
      NEXT_PUBLIC_SIGNIN_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/sign-in/
      NEXT_PUBLIC_SIGNOUT_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/signed-out/
      NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
      NEXT_PUBLIC_SA_WSS_URL: ${{ vars.NEXT_PUBLIC_SA_WSS_URL }}
      # Max tickers enriched concurrently in enrichHoldings (Portfolio/Watchlist/
      # Home). Bounds the per-user burst of Lambda invocations against the account
      # concurrency quota. Baked at build (NEXT_PUBLIC_*). Default 4; set the
      # NEXT_PUBLIC_ENRICH_CONCURRENCY environment var to 10 for prod. Parsed +
      # clamped [1,32] at runtime by resolveConcurrencyLimit.
      NEXT_PUBLIC_ENRICH_CONCURRENCY: ${{ vars.NEXT_PUBLIC_ENRICH_CONCURRENCY || '4' }}
    steps:
      - uses: actions/checkout@v4


      - name: Check required env vars are set
        run: bash scripts/ci/check-required-env-vars.sh apps/stock-analyser/.env.example dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — Stock Analyser stacks (dev)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/stock-analyser.ts' 'TransformotionDev-StockAnalyserTables' 'TransformotionDev-StockAnalyserWs' 'TransformotionDev-StockAnalyserApi' --require-approval never

      - name: Extract Stock Analyser API URLs from CDK output
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionDev-StockAnalyserApi \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          AI_API_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionDev-StockAnalyserApi \
            --query "Stacks[0].Outputs[?OutputKey=='AiApiUrl'].OutputValue" \
            --output text)
          AI_CACHE_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionDev-StockAnalyserApi \
            --query "Stacks[0].Outputs[?OutputKey=='AnalysisCacheUrl'].OutputValue" \
            --output text)
          if [ -z "$API_URL" ] || [ -z "$AI_API_URL" ] || [ -z "$AI_CACHE_URL" ]; then
            echo "ERROR: Could not extract API URLs from TransformotionDev-StockAnalyserApi stack"
            exit 1
          fi
          echo "NEXT_PUBLIC_API_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_AI_API_URL=$AI_API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_AI_CACHE_URL=$AI_CACHE_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CLAUDE_API_URL=$AI_API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CLAUDE_CACHE_URL=$AI_CACHE_URL" >> $GITHUB_ENV
          echo "Extracted SA API URL: $API_URL"

      - name: Extract Stock Analyser WebSocket URL from CDK output
        run: |
          SA_WSS_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionDev-StockAnalyserWs \
            --query "Stacks[0].Outputs[?OutputKey=='WssUrl'].OutputValue" \
            --output text)
          if [ -z "$SA_WSS_URL" ]; then
            echo "ERROR: Could not extract WssUrl from TransformotionDev-StockAnalyserWs stack"
            exit 1
          fi
          echo "NEXT_PUBLIC_SA_WSS_URL=$SA_WSS_URL" >> $GITHUB_ENV
          echo "Extracted SA WSS URL: $SA_WSS_URL"

      - name: Extract Launchpad control-plane URL from CDK output
        run: |
          CP_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionDev-LaunchpadControlPlane \
            --query "Stacks[0].Outputs[?OutputKey=='ControlPlaneApiUrl'].OutputValue" \
            --output text)
          if [ -z "$CP_URL" ] || [ "$CP_URL" = "None" ]; then
            echo "ERROR: ControlPlaneApiUrl missing/empty on TransformotionDev-LaunchpadControlPlane."
            echo "Refusing to build with an empty NEXT_PUBLIC_LAUNCHPAD_CONTROL_PLANE_API_URL —"
            echo "active-account and no-access logic would silently fall back to claims/error."
            exit 1
          fi
          echo "NEXT_PUBLIC_LAUNCHPAD_CONTROL_PLANE_API_URL=$CP_URL" >> $GITHUB_ENV
          echo "Extracted Launchpad control-plane URL: $CP_URL"

      - name: Build Next.js (static export)
        working-directory: apps/stock-analyser
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync apps/stock-analyser/out s3://transformotion-web-dev-959516291617/stock-analyser --delete

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1128DYYBLMWYK \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E1128DYYBLMWYK \
            --id "$INVALIDATION_ID"

      - name: Verify deployment
        env:
          CI_COGNITO_USERNAME: ${{ secrets.CI_COGNITO_USERNAME }}
          CI_COGNITO_PASSWORD: ${{ secrets.CI_COGNITO_PASSWORD }}
          COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_STOCK_ANALYSER_COGNITO_CLIENT_ID }}
        run: |
          export API_BASE_URL="${NEXT_PUBLIC_API_URL}"
          bash scripts/ci/verify-deploy.sh \
            "${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser" \
            apps/stock-analyser/.env.example \
            "${{ github.sha }}" \
            "stock-analyser" \
            "/portfolio"

  deploy-prod:
    name: Stock Analyser → Prod
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_call' && inputs.target == 'prod') || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment: prod
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_AI_API_URL: ${{ vars.NEXT_PUBLIC_AI_API_URL }}
      NEXT_PUBLIC_AI_CACHE_URL: ${{ vars.NEXT_PUBLIC_AI_CACHE_URL }}
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_STOCK_ANALYSER_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser/callback
      NEXT_PUBLIC_RUNTIME_PROFILE: live
      NEXT_PUBLIC_BUDGET_URL: ${{ vars.NEXT_PUBLIC_BUDGET_URL }}
      NEXT_PUBLIC_SIGNIN_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/sign-in/
      NEXT_PUBLIC_SIGNOUT_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/signed-out/
      NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
      NEXT_PUBLIC_SA_WSS_URL: ${{ vars.NEXT_PUBLIC_SA_WSS_URL }}
      # Max tickers enriched concurrently in enrichHoldings (Portfolio/Watchlist/
      # Home). Bounds the per-user burst of Lambda invocations against the account
      # concurrency quota. Baked at build (NEXT_PUBLIC_*). Default 4; set the
      # NEXT_PUBLIC_ENRICH_CONCURRENCY environment var to 10 for prod. Parsed +
      # clamped [1,32] at runtime by resolveConcurrencyLimit.
      NEXT_PUBLIC_ENRICH_CONCURRENCY: ${{ vars.NEXT_PUBLIC_ENRICH_CONCURRENCY || '4' }}
    steps:
      - uses: actions/checkout@v4


      - name: Check required env vars are set
        run: bash scripts/ci/check-required-env-vars.sh apps/stock-analyser/.env.example prod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — Stock Analyser stacks (prod)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/stock-analyser.ts' 'TransformotionProd-StockAnalyserTables' 'TransformotionProd-StockAnalyserWs' 'TransformotionProd-StockAnalyserApi' --require-approval never

      - name: Extract Stock Analyser API URLs from CDK output
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionProd-StockAnalyserApi \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          AI_API_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionProd-StockAnalyserApi \
            --query "Stacks[0].Outputs[?OutputKey=='AiApiUrl'].OutputValue" \
            --output text)
          AI_CACHE_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionProd-StockAnalyserApi \
            --query "Stacks[0].Outputs[?OutputKey=='AnalysisCacheUrl'].OutputValue" \
            --output text)
          if [ -z "$API_URL" ] || [ -z "$AI_API_URL" ] || [ -z "$AI_CACHE_URL" ]; then
            echo "ERROR: Could not extract API URLs from TransformotionProd-StockAnalyserApi stack"
            exit 1
          fi
          echo "NEXT_PUBLIC_API_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_AI_API_URL=$AI_API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_AI_CACHE_URL=$AI_CACHE_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CLAUDE_API_URL=$AI_API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CLAUDE_CACHE_URL=$AI_CACHE_URL" >> $GITHUB_ENV
          echo "Extracted SA API URL: $API_URL"

      - name: Extract Stock Analyser WebSocket URL from CDK output
        run: |
          SA_WSS_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionProd-StockAnalyserWs \
            --query "Stacks[0].Outputs[?OutputKey=='WssUrl'].OutputValue" \
            --output text)
          if [ -z "$SA_WSS_URL" ]; then
            echo "ERROR: Could not extract WssUrl from TransformotionProd-StockAnalyserWs stack"
            exit 1
          fi
          echo "NEXT_PUBLIC_SA_WSS_URL=$SA_WSS_URL" >> $GITHUB_ENV
          echo "Extracted SA WSS URL: $SA_WSS_URL"

      - name: Extract Launchpad control-plane URL from CDK output
        run: |
          CP_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionProd-LaunchpadControlPlane \
            --query "Stacks[0].Outputs[?OutputKey=='ControlPlaneApiUrl'].OutputValue" \
            --output text)
          if [ -z "$CP_URL" ] || [ "$CP_URL" = "None" ]; then
            echo "ERROR: ControlPlaneApiUrl missing/empty on TransformotionProd-LaunchpadControlPlane."
            echo "Refusing to build with an empty NEXT_PUBLIC_LAUNCHPAD_CONTROL_PLANE_API_URL —"
            echo "active-account and no-access logic would silently fall back to claims/error."
            exit 1
          fi
          echo "NEXT_PUBLIC_LAUNCHPAD_CONTROL_PLANE_API_URL=$CP_URL" >> $GITHUB_ENV
          echo "Extracted Launchpad control-plane URL: $CP_URL"

      - name: Build Next.js (static export)
        working-directory: apps/stock-analyser
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync apps/stock-analyser/out s3://transformotion-prod-bucket/stock-analyser --delete

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --id "$INVALIDATION_ID"

      - name: Verify deployment
        env:
          CI_COGNITO_USERNAME: ${{ secrets.CI_COGNITO_USERNAME }}
          CI_COGNITO_PASSWORD: ${{ secrets.CI_COGNITO_PASSWORD }}
          COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_STOCK_ANALYSER_COGNITO_CLIENT_ID }}
        run: |
          export API_BASE_URL="${NEXT_PUBLIC_API_URL}"
          bash scripts/ci/verify-deploy.sh \
            "${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser" \
            apps/stock-analyser/.env.example \
            "${{ github.sha }}" \
            "stock-analyser" \
            "/portfolio"
