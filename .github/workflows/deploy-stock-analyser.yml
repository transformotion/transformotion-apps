name: Deploy — Stock Analyser

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/stock-analyser/**'
      - 'infrastructure/bin/stock-analyser.ts'
      - 'packages/api-client/**'
      - 'packages/ui/**'
      - 'packages/auth-client/**'
      - 'packages/lambda-middleware/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-stock-analyser-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ROLE_ARN: arn:aws:iam::959516291617:role/GitHubActionsDeployRole

jobs:
  deploy-dev:
    name: Stock Analyser → Dev
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment: dev
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_CLAUDE_API_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_API_URL }}
      NEXT_PUBLIC_CLAUDE_CACHE_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_CACHE_URL }}
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_STOCK_ANALYSER_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser/callback
      NEXT_PUBLIC_RUNTIME_PROFILE: live
      NEXT_PUBLIC_BUDGET_URL: ${{ vars.NEXT_PUBLIC_BUDGET_URL }}
      NEXT_PUBLIC_SIGNIN_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/sign-in/
      NEXT_PUBLIC_SIGNOUT_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/signed-out/
      NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required env vars are set
        run: bash scripts/ci/check-required-env-vars.sh apps/stock-analyser/.env.example dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — Stock Analyser stacks (dev)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'bin/stock-analyser.ts' 'TransformotionDev-StockAnalyserApi' --require-approval never

      - name: Wait for PlatformWs stack (handles first-deploy race; see #295)
        run: |
          STACK=TransformotionDev-PlatformWs
          if aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; then
            echo "$STACK exists, proceeding"
          else
            echo "$STACK not found, waiting up to 20 min..."
            ATTEMPTS=0
            until aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge 40 ]; then
                echo "ERROR: $STACK not found after $((ATTEMPTS * 30))s"
                exit 1
              fi
              echo "Attempt $ATTEMPTS/40: waiting 30s..."
              sleep 30
            done
            echo "$STACK found, waiting for CREATE_COMPLETE..."
            aws cloudformation wait stack-create-complete --stack-name "$STACK"
            echo "$STACK is ready"
          fi

      - name: Extract WebSocket URL from CDK output
        run: |
          WSS_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionDev-PlatformWs \
            --query "Stacks[0].Outputs[?OutputKey=='WssUrl'].OutputValue" \
            --output text)
          if [ -z "$WSS_URL" ]; then
            echo "ERROR: Could not extract WssUrl from TransformotionDev-PlatformWs stack"
            exit 1
          fi
          echo "NEXT_PUBLIC_PLATFORM_WSS_URL=$WSS_URL" >> $GITHUB_ENV
          echo "Extracted WSS URL: $WSS_URL"

      - name: Build Next.js (static export)
        working-directory: apps/stock-analyser
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync apps/stock-analyser/out s3://transformotion-web-dev-959516291617/stock-analyser --delete

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1128DYYBLMWYK \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E1128DYYBLMWYK \
            --id "$INVALIDATION_ID"

      - name: Verify deployment
        env:
          CI_COGNITO_USERNAME: ${{ secrets.CI_COGNITO_USERNAME }}
          CI_COGNITO_PASSWORD: ${{ secrets.CI_COGNITO_PASSWORD }}
          COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_STOCK_ANALYSER_COGNITO_CLIENT_ID }}
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          bash scripts/ci/verify-deploy.sh \
            "${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser" \
            apps/stock-analyser/.env.example \
            "${{ github.sha }}" \
            "stock-analyser" \
            "/api/user/profile"

  deploy-prod:
    name: Stock Analyser → Prod
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment: prod
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_CLAUDE_API_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_API_URL }}
      NEXT_PUBLIC_CLAUDE_CACHE_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_CACHE_URL }}
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_STOCK_ANALYSER_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser/callback
      NEXT_PUBLIC_RUNTIME_PROFILE: live
      NEXT_PUBLIC_BUDGET_URL: ${{ vars.NEXT_PUBLIC_BUDGET_URL }}
      NEXT_PUBLIC_SIGNIN_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/sign-in/
      NEXT_PUBLIC_SIGNOUT_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/signed-out/
      NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required env vars are set
        run: bash scripts/ci/check-required-env-vars.sh apps/stock-analyser/.env.example prod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — Stock Analyser stacks (prod)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'bin/stock-analyser.ts' 'TransformotionProd-StockAnalyserTables' 'TransformotionProd-StockAnalyserApi' --require-approval never

      - name: Wait for PlatformWs stack (handles first-deploy race; see #295)
        run: |
          STACK=TransformotionProd-PlatformWs
          if aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; then
            echo "$STACK exists, proceeding"
          else
            echo "$STACK not found, waiting up to 20 min..."
            ATTEMPTS=0
            until aws cloudformation describe-stacks --stack-name "$STACK" >/dev/null 2>&1; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge 40 ]; then
                echo "ERROR: $STACK not found after $((ATTEMPTS * 30))s"
                exit 1
              fi
              echo "Attempt $ATTEMPTS/40: waiting 30s..."
              sleep 30
            done
            echo "$STACK found, waiting for CREATE_COMPLETE..."
            aws cloudformation wait stack-create-complete --stack-name "$STACK"
            echo "$STACK is ready"
          fi

      - name: Extract WebSocket URL from CDK output
        run: |
          WSS_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionProd-PlatformWs \
            --query "Stacks[0].Outputs[?OutputKey=='WssUrl'].OutputValue" \
            --output text)
          if [ -z "$WSS_URL" ]; then
            echo "ERROR: Could not extract WssUrl from TransformotionProd-PlatformWs stack"
            exit 1
          fi
          echo "NEXT_PUBLIC_PLATFORM_WSS_URL=$WSS_URL" >> $GITHUB_ENV
          echo "Extracted WSS URL: $WSS_URL"

      - name: Build Next.js (static export)
        working-directory: apps/stock-analyser
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync apps/stock-analyser/out s3://transformotion-prod-bucket/stock-analyser --delete

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --id "$INVALIDATION_ID"

      - name: Verify deployment
        env:
          CI_COGNITO_USERNAME: ${{ secrets.CI_COGNITO_USERNAME }}
          CI_COGNITO_PASSWORD: ${{ secrets.CI_COGNITO_PASSWORD }}
          COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_STOCK_ANALYSER_COGNITO_CLIENT_ID }}
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          bash scripts/ci/verify-deploy.sh \
            "${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser" \
            apps/stock-analyser/.env.example \
            "${{ github.sha }}" \
            "stock-analyser" \
            "/api/user/profile"
