name: Deploy — Launchpad

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/deploy-launchpad.yml'
      - 'apps/launchpad/**'
      - '!apps/launchpad/AGENTS.md'
      - '!apps/launchpad/CLAUDE.md'
      - '!apps/launchpad/README.md'
      - '!apps/launchpad/docs/**'
      - 'infrastructure/lib/**'
      - 'infrastructure/bin/launchpad.ts'
      - 'platform/config/app-registry.json'
      - 'packages/auth-client/**'
      - 'packages/brand-tokens/**'
      - 'packages/contracts/**'
      - 'packages/lambda-middleware/**'
      - 'packages/runtime-config/**'
      - '!packages/**/AGENTS.md'
      - '!packages/**/CLAUDE.md'
      - '!packages/**/README.md'
      - '!packages/**/docs/**'
  workflow_call:
    inputs:
      target:
        required: true
        type: string
        description: 'Deploy target: dev or prod'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-launchpad-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ROLE_ARN: arn:aws:iam::959516291617:role/TransformotionLaunchpadDeployRole

jobs:
  deploy-dev:
    name: Launchpad → Dev
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_call' && inputs.target == 'dev') || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment: dev
    env:
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_LAUNCHPAD_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
      NEXT_PUBLIC_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/launchpad/callback
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_STOCK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser/
      NEXT_PUBLIC_BUDGET_URL: ${{ vars.NEXT_PUBLIC_BUDGET_TRACKER_APP_URL }}
      NEXT_PUBLIC_SIGNOUT_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/signed-out/
      NEXT_PUBLIC_RUNTIME_PROFILE: live
      NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4


      - name: Check required env vars are set
        run: bash scripts/ci/check-required-env-vars.sh apps/launchpad/.env.example dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy - Launchpad stacks (dev)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/launchpad.ts' 'TransformotionDev-Launchpad*' --require-approval never

      - name: Extract Launchpad stack outputs
        run: |
          stack_exists() {
            aws cloudformation describe-stacks --stack-name "$1" >/dev/null 2>&1
          }

          require_output() {
            local stack_name="$1"
            local output_key="$2"
            local env_name="$3"
            local value
            value=$(aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --query "Stacks[0].Outputs[?OutputKey=='$output_key'].OutputValue" \
              --output text)
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "ERROR: Could not extract $output_key from $stack_name"
              exit 1
            fi
            echo "$env_name=$value" >> "$GITHUB_ENV"
          }

          require_output TransformotionDev-LaunchpadControlPlane ControlPlaneApiUrl NEXT_PUBLIC_LAUNCHPAD_CONTROL_PLANE_API_URL

          require_output TransformotionDev-LaunchpadAuth UserPoolId NEXT_PUBLIC_COGNITO_USER_POOL_ID
          require_output TransformotionDev-LaunchpadAuth LaunchpadAppClientId NEXT_PUBLIC_COGNITO_CLIENT_ID
          require_output TransformotionDev-LaunchpadAuth CognitoDomain NEXT_PUBLIC_COGNITO_DOMAIN

      - name: Verify Launchpad output extraction
        run: |
          CONTROL_PLANE_API_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionDev-LaunchpadControlPlane \
            --query "Stacks[0].Outputs[?OutputKey=='ControlPlaneApiUrl'].OutputValue" \
            --output text)
          if [ -z "$CONTROL_PLANE_API_URL" ] || [ "$CONTROL_PLANE_API_URL" = "None" ]; then
            echo "ERROR: Could not extract ControlPlaneApiUrl from TransformotionDev-LaunchpadControlPlane stack"
            exit 1
          fi
          echo "Launchpad control-plane URL: $CONTROL_PLANE_API_URL"

      - name: Build Next.js (static export)
        working-directory: apps/launchpad
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync apps/launchpad/out s3://transformotion-web-dev-959516291617

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1128DYYBLMWYK \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E1128DYYBLMWYK \
            --id "$INVALIDATION_ID"

      - name: Verify deployment
        run: |
          bash scripts/ci/verify-deploy.sh \
            "https://dev.apps.transformotion.com.au/" \
            apps/launchpad/.env.example \
            "${{ github.sha }}" \
            "launchpad"

  deploy-prod:
    name: Launchpad → Prod
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_call' && inputs.target == 'prod') || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment: prod
    env:
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_LAUNCHPAD_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
      NEXT_PUBLIC_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/launchpad/callback
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_STOCK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/stock-analyser/
      NEXT_PUBLIC_BUDGET_URL: ${{ vars.NEXT_PUBLIC_BUDGET_TRACKER_APP_URL }}
      NEXT_PUBLIC_SIGNOUT_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/signed-out/
      NEXT_PUBLIC_RUNTIME_PROFILE: live
      NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4


      - name: Check required env vars are set
        run: bash scripts/ci/check-required-env-vars.sh apps/launchpad/.env.example prod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy - Launchpad stacks (prod)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/launchpad.ts' 'TransformotionProd-Launchpad*' --require-approval never

      - name: Extract Launchpad stack outputs
        run: |
          stack_exists() {
            aws cloudformation describe-stacks --stack-name "$1" >/dev/null 2>&1
          }

          require_output() {
            local stack_name="$1"
            local output_key="$2"
            local env_name="$3"
            local value
            value=$(aws cloudformation describe-stacks \
              --stack-name "$stack_name" \
              --query "Stacks[0].Outputs[?OutputKey=='$output_key'].OutputValue" \
              --output text)
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "ERROR: Could not extract $output_key from $stack_name"
              exit 1
            fi
            echo "$env_name=$value" >> "$GITHUB_ENV"
          }

          require_output TransformotionProd-LaunchpadControlPlane ControlPlaneApiUrl NEXT_PUBLIC_LAUNCHPAD_CONTROL_PLANE_API_URL

          require_output TransformotionProd-LaunchpadAuth UserPoolId NEXT_PUBLIC_COGNITO_USER_POOL_ID
          require_output TransformotionProd-LaunchpadAuth LaunchpadAppClientId NEXT_PUBLIC_COGNITO_CLIENT_ID
          require_output TransformotionProd-LaunchpadAuth CognitoDomain NEXT_PUBLIC_COGNITO_DOMAIN

      - name: Verify Launchpad output extraction
        run: |
          CONTROL_PLANE_API_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionProd-LaunchpadControlPlane \
            --query "Stacks[0].Outputs[?OutputKey=='ControlPlaneApiUrl'].OutputValue" \
            --output text)
          if [ -z "$CONTROL_PLANE_API_URL" ] || [ "$CONTROL_PLANE_API_URL" = "None" ]; then
            echo "ERROR: Could not extract ControlPlaneApiUrl from TransformotionProd-LaunchpadControlPlane stack"
            exit 1
          fi
          echo "Launchpad control-plane URL: $CONTROL_PLANE_API_URL"

      - name: Build Next.js (static export)
        working-directory: apps/launchpad
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync apps/launchpad/out s3://transformotion-prod-bucket

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --id "$INVALIDATION_ID"

      - name: Verify deployment
        run: |
          bash scripts/ci/verify-deploy.sh \
            "https://apps.transformotion.com.au/" \
            apps/launchpad/.env.example \
            "${{ github.sha }}" \
            "launchpad"
