name: Deploy — Budget Tracker

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/budget-tracker/**'
      - 'infrastructure/lib/budget-tracker/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-budget-tracker-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ROLE_ARN: arn:aws:iam::959516291617:role/GitHubActionsDeployRole

jobs:
  deploy-dev:
    name: Budget Tracker → Dev
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment: dev
    env:
      NEXT_PUBLIC_RUNTIME_PROFILE: live
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_CLAUDE_API_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_API_URL }}
      NEXT_PUBLIC_CLAUDE_CACHE_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_CACHE_URL }}
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_BUDGET_TRACKER_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
      NEXT_PUBLIC_BUDGET_TRACKER_APP_URL: ${{ vars.NEXT_PUBLIC_BUDGET_TRACKER_APP_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/budget-tracker/callback
      NEXT_PUBLIC_LAUNCHPAD_URL: ${{ vars.NEXT_PUBLIC_LAUNCHPAD_URL }}
      NEXT_PUBLIC_SIGNIN_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/sign-in/
      NEXT_PUBLIC_SIGNOUT_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/signed-out/
      NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required env vars are set
        run: bash scripts/ci/check-required-env-vars.sh apps/budget-tracker/.env.example dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — Budget Tracker stacks (dev)
        working-directory: infrastructure
        run: pnpm exec cdk deploy 'TransformotionDev-BudgetTrackerTables' 'TransformotionDev-BudgetTrackerApi' 'TransformotionDev-BudgetTrackerWs' --require-approval never

      - name: Extract WebSocket URL from CDK output
        run: |
          WSS_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionDev-BudgetTrackerWs \
            --query "Stacks[0].Outputs[?OutputKey=='WssUrl'].OutputValue" \
            --output text)
          if [ -z "$WSS_URL" ]; then
            echo "ERROR: Could not extract WssUrl from TransformotionDev-BudgetTrackerWs stack"
            exit 1
          fi
          echo "NEXT_PUBLIC_BUDGET_WSS_URL=$WSS_URL" >> $GITHUB_ENV
          echo "Extracted WSS URL: $WSS_URL"

      - name: Build Next.js (static export)
        working-directory: apps/budget-tracker
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync apps/budget-tracker/out s3://transformotion-web-dev-959516291617/budget-tracker --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E1128DYYBLMWYK --paths "/budget-tracker/*"

      - name: Verify deployment
        run: |
          bash scripts/ci/verify-deploy.sh \
            "${{ vars.NEXT_PUBLIC_BUDGET_TRACKER_APP_URL }}" \
            apps/budget-tracker/.env.example \
            "${{ github.sha }}"

  deploy-prod:
    name: Budget Tracker → Prod
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment: prod
    env:
      NEXT_PUBLIC_RUNTIME_PROFILE: live
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_CLAUDE_API_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_API_URL }}
      NEXT_PUBLIC_CLAUDE_CACHE_URL: ${{ vars.NEXT_PUBLIC_CLAUDE_CACHE_URL }}
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_BUDGET_TRACKER_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_COGNITO_REGION: ${{ vars.NEXT_PUBLIC_COGNITO_REGION }}
      NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
      NEXT_PUBLIC_BUDGET_TRACKER_APP_URL: ${{ vars.NEXT_PUBLIC_BUDGET_TRACKER_APP_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/budget-tracker/callback
      NEXT_PUBLIC_LAUNCHPAD_URL: ${{ vars.NEXT_PUBLIC_LAUNCHPAD_URL }}
      NEXT_PUBLIC_SIGNIN_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/sign-in/
      NEXT_PUBLIC_SIGNOUT_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}/signed-out/
      NEXT_PUBLIC_COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required env vars are set
        run: bash scripts/ci/check-required-env-vars.sh apps/budget-tracker/.env.example prod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — Budget Tracker stacks (prod)
        working-directory: infrastructure
        run: pnpm exec cdk deploy 'TransformotionProd-BudgetTrackerTables' 'TransformotionProd-BudgetTrackerApi' 'TransformotionProd-BudgetTrackerWs' --require-approval never

      - name: Extract WebSocket URL from CDK output
        run: |
          WSS_URL=$(aws cloudformation describe-stacks \
            --stack-name TransformotionProd-BudgetTrackerWs \
            --query "Stacks[0].Outputs[?OutputKey=='WssUrl'].OutputValue" \
            --output text)
          if [ -z "$WSS_URL" ]; then
            echo "ERROR: Could not extract WssUrl from TransformotionProd-BudgetTrackerWs stack"
            exit 1
          fi
          echo "NEXT_PUBLIC_BUDGET_WSS_URL=$WSS_URL" >> $GITHUB_ENV
          echo "Extracted WSS URL: $WSS_URL"

      - name: Build Next.js (static export)
        working-directory: apps/budget-tracker
        run: pnpm build

      - name: Deploy to S3
        run: aws s3 sync apps/budget-tracker/out s3://transformotion-prod-bucket/budget-tracker --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }} --paths "/budget-tracker/*"

      - name: Verify deployment
        run: |
          bash scripts/ci/verify-deploy.sh \
            "${{ vars.NEXT_PUBLIC_BUDGET_TRACKER_APP_URL }}" \
            apps/budget-tracker/.env.example \
            "${{ github.sha }}"
