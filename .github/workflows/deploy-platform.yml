name: Deploy — Platform Infrastructure

on:
  push:
    branches: [develop, main]
    paths:
      - 'platform/infrastructure/**'
      - 'infrastructure/bin/platform.ts'
      - 'platform/functions/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-platform-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ROLE_ARN: arn:aws:iam::959516291617:role/GitHubActionsDeployRole

jobs:
  deploy-dev:
    name: Platform → Dev
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — GithubActionsRole (account-level, deploy once)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/platform.ts' 'Transformotion-GithubActionsRole' --require-approval never

      - name: CDK Deploy — PlatformTables (dev)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/platform.ts' 'TransformotionDev-PlatformTables' --require-approval never

      - name: CDK Deploy — Platform stacks (dev)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/platform.ts' 'TransformotionDev-Storage' 'TransformotionDev-Network' 'TransformotionDev-Auth' 'TransformotionDev-AuthApi' 'TransformotionDev-Api' --require-approval never

      - name: CDK Deploy — PlatformWs (dev)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/platform.ts' 'TransformotionDev-PlatformWs' --require-approval never

  deploy-prod:
    name: Platform → Prod
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy — GithubActionsRole (account-level, deploy once)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/platform.ts' 'Transformotion-GithubActionsRole' --require-approval never

      - name: CDK Deploy — PlatformTables (prod)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/platform.ts' 'TransformotionProd-PlatformTables' --require-approval never

      - name: CDK Deploy — Platform stacks (prod)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/platform.ts' 'TransformotionProd-Storage' 'TransformotionProd-Network' 'TransformotionProd-Auth' 'TransformotionProd-AuthApi' 'TransformotionProd-Api' --require-approval never

      - name: CDK Deploy — PlatformWs (prod)
        working-directory: infrastructure
        run: pnpm exec cdk deploy --app 'npx ts-node --prefer-ts-exts bin/platform.ts' 'TransformotionProd-PlatformWs' --require-approval never

  # ── App cascades ─────────────────────────────────────────────────────────────
  # Reusable-workflow calls fire after whichever platform job succeeded.
  # Using always() + result check so a skipped sibling job does not
  # prevent the cascade from running.
  # target is 'prod' when the prod platform job succeeded, otherwise 'dev'.

  cascade-stock-analyser:
    needs: [deploy-dev, deploy-prod]
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-prod.result == 'success')
    uses: ./.github/workflows/deploy-stock-analyser.yml
    with:
      target: ${{ needs.deploy-prod.result == 'success' && 'prod' || 'dev' }}
    secrets: inherit

  cascade-budget-tracker:
    needs: [deploy-dev, deploy-prod]
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-prod.result == 'success')
    uses: ./.github/workflows/deploy-budget-tracker.yml
    with:
      target: ${{ needs.deploy-prod.result == 'success' && 'prod' || 'dev' }}
    secrets: inherit

  cascade-migration-utilities:
    needs: [deploy-dev, deploy-prod]
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-prod.result == 'success')
    uses: ./.github/workflows/deploy-migration-utilities.yml
    with:
      target: ${{ needs.deploy-prod.result == 'success' && 'prod' || 'dev' }}
    secrets: inherit

  cascade-launchpad:
    needs: [deploy-dev, deploy-prod]
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-prod.result == 'success')
    uses: ./.github/workflows/deploy-launchpad.yml
    with:
      target: ${{ needs.deploy-prod.result == 'success' && 'prod' || 'dev' }}
    secrets: inherit
