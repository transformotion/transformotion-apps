name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm turbo typecheck

      - name: Lint (all workspaces)
        run: pnpm turbo lint

      - name: Lint baseline check (no new violations)
        run: bash scripts/ci/check-lint-baseline.sh

  infra-synth:
    name: CDK Synth (validate templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CDK Synth — dev
        working-directory: infrastructure
        run: pnpm exec cdk synth TransformotionDev-Network

      - name: CDK Synth — prod
        working-directory: infrastructure
        run: pnpm exec cdk synth TransformotionProd-Network
