name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repo-owned contracts
        run: pnpm check:contracts

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Lint baseline check (no new violations)
        run: bash scripts/ci/check-lint-baseline.sh

      - name: No requireGroup in handlers (deprecated)
        run: bash scripts/ci/check-no-new-require-group.sh

      - name: Handler authorization pattern (DynamoDB -> authz helper required)
        run: bash scripts/ci/check-handler-authz-pattern.sh

      - name: Verify baseline didn't grow vs base branch
        run: |
          BASE="${{ github.base_ref }}"
          if ! git show "origin/$BASE:.lint-baseline.json" > /tmp/base-baseline.json 2>/dev/null; then
            echo "No baseline on origin/$BASE - first introduction, skipping growth check."
            exit 0
          fi
          if git diff "origin/$BASE" -- eslint.config.mjs | grep -q '^+' 2>/dev/null; then
            echo "eslint.config.mjs changed in this PR - baseline growth is expected, skipping growth check."
            exit 0
          fi
          BASE_TOTAL=$(jq '[.. | numbers] | add // 0' /tmp/base-baseline.json)
          PR_TOTAL=$(jq '[.. | numbers] | add // 0' .lint-baseline.json)
          echo "Base violations: $BASE_TOTAL  PR violations: $PR_TOTAL"
          if [ "$PR_TOTAL" -gt "$BASE_TOTAL" ]; then
            echo "ERROR: Baseline grew ($BASE_TOTAL -> $PR_TOTAL). Fix violations or justify the growth in this PR."
            exit 1
          fi
          echo "Baseline growth check passed."

  build:
    name: Build (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - { name: budget-tracker, dir: apps/budget-tracker }
          - { name: stock-analyser, dir: apps/stock-analyser }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app.name }}
        working-directory: ${{ matrix.app.dir }}
        env:
          NEXT_PUBLIC_RUNTIME_PROFILE: mock
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-southeast-2_placeholder
          NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder-client-id
          NEXT_PUBLIC_COGNITO_REGION: ap-southeast-2
          NEXT_PUBLIC_COGNITO_DOMAIN: placeholder.auth.ap-southeast-2.amazoncognito.com
          NEXT_PUBLIC_API_URL: https://placeholder.execute-api.ap-southeast-2.amazonaws.com/dev
          NEXT_PUBLIC_CLAUDE_API_URL: https://placeholder.execute-api.ap-southeast-2.amazonaws.com/dev/api/claude
          NEXT_PUBLIC_CLAUDE_CACHE_URL: https://placeholder.execute-api.ap-southeast-2.amazonaws.com/dev/analysis-cache
          NEXT_PUBLIC_CALLBACK_URL: http://localhost:3000/callback
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: pnpm build

  infra-synth:
    name: CDK Synth (validate templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CDK Synth - dev
        working-directory: infrastructure
        run: pnpm exec cdk synth TransformotionDev-Network

      - name: CDK Synth - prod
        working-directory: infrastructure
        run: pnpm exec cdk synth TransformotionProd-Network

      - name: CDK Synth - MigrationsApi (dev)
        working-directory: infrastructure
        run: pnpm exec cdk synth --app 'npx ts-node --prefer-ts-exts bin/migration-utilities.ts' TransformotionDev-MigrationsApi
