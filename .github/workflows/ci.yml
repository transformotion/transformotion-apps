name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npx turbo typecheck

      - name: Lint (all workspaces)
        run: npx turbo lint

  infra-synth:
    name: CDK Synth (validate templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=infra

      - name: CDK Synth — dev
        working-directory: infra
        run: npx cdk synth TransformotionDev-Network

      - name: CDK Synth — prod
        working-directory: infra
        run: npx cdk synth TransformotionProd-Network
