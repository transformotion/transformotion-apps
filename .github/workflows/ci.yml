# CI pipeline — implemented in Phase 0 session S0.4
# Runs on every pull request: lint, typecheck, unit tests.
# See DEVELOPMENT_PLAN.md Section 2.7.
name: CI
on:
  pull_request:
    branches: [main, develop]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
